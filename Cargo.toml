[package]
name = "prowlarr-telegram-client"
version = "0.1.0"
edition = "2021"
license = "AGPL-3"
authors = ["Kirill Fertikov"]
repository = "https://github.com/fertkir/prowlarr-telegram-client"
keywords = ["torrents", "telegram-bot", "prowlarr"]

[features]
default = []
redis-storage = ["redis", "serde_json"]

[dependencies]
teloxide = { version = "0.17.0", features = ["webhooks", "webhooks-axum"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
log = "0.4.33"
env_logger = "0.11.11"
rust-i18n = "4.2.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"]  }
serde = "1.0.229"
chrono = { version = "0.4.45", features = ["serde"] }
byte-unit = "5.2.5"
dashmap = "6.2.1"
rand = "0.10.2"
bytes = "1.12.1"
url = "2.5.8"
warp = { version = "0.4.3", features = ["server"] }
hightorrent = "0.4.1"
derive_more = { version = "2.1.1", features = ["display"] }
async-trait = "0.1.92"
redis = { version = "1.5.0", features = ["tokio-comp"], optional = true }
serde_json = { version = "1.0.151", features = [], optional = true }
thiserror = "2.0.20"

[dev-dependencies]
temp-env = "0.3.6"
tempfile = "3.27.0"
wiremock = "0.6.5"
mockall = "0.15.0"
